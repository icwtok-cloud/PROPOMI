services:
  - type: web
    name: propomi-api
    env: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_KEY
        sync: false

  # Cron jobs: requieren plan Render que los soporte. Si el plan actual no
  # los tiene, dejar comentados y usar un scheduler externo (p.ej.
